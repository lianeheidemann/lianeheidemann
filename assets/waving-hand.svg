<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="Animated waving hand">
  <defs>
    <linearGradient id="hand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff9ff"/>
      <stop offset="55%" stop-color="#74e4ff"/>
      <stop offset="100%" stop-color="#43bff7"/>
    </linearGradient>
    <linearGradient id="motion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#7c6cff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.35" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(38 42)">
    <g filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate"
        values="0 0 0;-13 0 0;10 0 0;-9 0 0;7 0 0;0 0 0"
        keyTimes="0;0.18;0.38;0.58;0.78;1"
        dur="1.9s" repeatCount="indefinite"/>

      <path d="M-9 14
               C-12 9 -14 3 -13 -3
               C-12 -7 -9 -9 -6 -8
               C-4 -7 -2 -4 0 -1
               L3 3
               L2 -20
               C2 -24 6 -25 8 -21
               L9 -4
               L12 -25
               C13 -29 17 -29 19 -25
               L19 -5
               L22 -24
               C23 -28 27 -28 29 -24
               L29 -4
               L32 -19
               C33 -23 37 -22 38 -18
               L37 -1
               C37 7 33 14 26 18
               C21 21 15 22 9 22
               L0 22
               C-4 21 -7 18 -9 14 Z"
            fill="url(#hand)" stroke="#7cecff" stroke-width="1.7" stroke-linejoin="round"/>

      <path d="M-4 5 C-1 7 1 10 2 14" fill="none" stroke="#ecfeff" stroke-width="2" stroke-linecap="round" opacity=".85"/>
      <path d="M10 0 C11 6 11 12 10 17" fill="none" stroke="#ecfeff" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>
      <path d="M20 -1 C21 5 21 11 20 16" fill="none" stroke="#ecfeff" stroke-width="1.6" stroke-linecap="round" opacity=".42"/>
      <path d="M30 -1 C31 4 31 9 30 14" fill="none" stroke="#ecfeff" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>
    </g>

    <g fill="none" stroke="url(#motion)" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)">
      <path d="M-23 -22 Q-31 -14 -28 -5" opacity="0">
        <animate attributeName="opacity" values="0;.9;.15;0" keyTimes="0;.25;.55;1" dur="1.9s" repeatCount="indefinite"/>
      </path>
      <path d="M-31 -28 Q-41 -17 -36 -3" opacity="0">
        <animate attributeName="opacity" values="0;.75;0;.45;0" keyTimes="0;.2;.45;.7;1" dur="1.9s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
