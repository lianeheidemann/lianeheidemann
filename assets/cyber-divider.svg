<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Animated cyber divider</title>
  <desc id="description">A cyan, blue and violet animated divider that adapts to the light or dark GitHub theme.</desc>
  <defs>
    <linearGradient id="divider-flow" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.4" stop-color="#38bdf8"/>
      <stop offset="0.68" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <filter id="divider-glow" x="-20%" y="-150%" width="140%" height="400%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      :root {
        --track: #cbd5e1;
        --panel: #ffffff;
        --panel-border: #bfdbfe;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --track: #1f2937;
          --panel: #071426;
          --panel-border: #334155;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .moving-highlight { display: none; }
      }
    </style>
  </defs>

  <path d="M0 60 H420 L480 100 H720 L780 60 H1200"
        stroke="var(--track)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M0 60 H420 L480 100 H720 L780 60 H1200"
        stroke="url(#divider-flow)" stroke-width="2" stroke-opacity="0.38"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path class="moving-highlight" d="M0 60 H420 L480 100 H720 L780 60 H1200"
        stroke="url(#divider-flow)" stroke-width="4" stroke-linecap="round"
        stroke-linejoin="round" stroke-dasharray="180 1600" filter="url(#divider-glow)">
    <animate attributeName="stroke-dashoffset" values="1780;0" dur="3s" repeatCount="indefinite"/>
  </path>

  <rect x="560" y="46" width="80" height="28" rx="14"
        fill="var(--panel)" stroke="var(--panel-border)"/>

  <circle cx="585" cy="60" r="5" fill="#22d3ee"/>
  <circle cx="600" cy="60" r="5" fill="#60a5fa"/>
  <circle cx="615" cy="60" r="5" fill="#8b5cf6"/>
</svg>
