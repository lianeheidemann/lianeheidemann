<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Animated waving hand" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="handFill" x1="20" y1="14" x2="80" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="55%" stop-color="#8feaff"/>
      <stop offset="100%" stop-color="#4fc8fb"/>
    </linearGradient>
    <linearGradient id="waveLine" x1="7" y1="26" x2="31" y2="62" gradientUnits="userSpaceOnUse">
