               C46 21 48 24 48 29
               L48 44
               L49 21
               C49 16 52 13 56 13
               C60 13 62 17 62 21
               L61 44
               L63 24
               C63 19 66 16 70 17
               C74 18 76 21 75 26
               L73 47
               L76 33
               C77 28 80 26 83 27
               C87 28 89 32 88 36
               L84 57
               C83 66 80 73 74 78
               C70 82 65 84 58 84
               L47 84
               C44 84 41 84 39 82 Z"
