<svg xmlns="http://www.w3.org/2000/svg" width="132" height="20" viewBox="0 0 132 20" role="img" aria-labelledby="title desc">
  <title id="title">Early Project</title>
  <desc id="desc">Compact, theme-adaptive blue badge with animated loading dots.</desc>
  <style>
    .bg { fill: #eff6ff; stroke: #3b82f6; }
