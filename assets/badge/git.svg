<svg xmlns="http://www.w3.org/2000/svg" width="120" height="44" viewBox="0 0 120 44" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">Git</title>
  <desc id="desc">Git badge with refined Git mark and automatic light and dark themes</desc>

  <style>
    .bg { fill: #FFE5DE; stroke: #CF391F; }
    .label { fill: #721E0F; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #26120e; stroke: #ff7458; }
      .label { fill: #fff6f3; }
    }
  </style>

  <rect class="bg" x=".75" y=".75" width="118.5" height="42.5" rx="10" stroke-width="1.5"/>

  <!-- Git mark, proportioned to match the familiar official silhouette -->
  <g>
    <rect x="17" y="11" width="22" height="22" rx="2.8"
          fill="#F05032" transform="rotate(45 28 22)"/>

    <g fill="none" stroke="#fff" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.8 12.8 L26.2 18.2"/>
      <path d="M26.2 18.2 L36.1 23.1"/>
      <path d="M26.2 18.2 L26.2 31.0"/>
    </g>

    <circle cx="26.2" cy="18.2" r="3.1" fill="#fff"/>
    <circle cx="36.1" cy="23.1" r="3.1" fill="#fff"/>
    <circle cx="26.2" cy="31.0" r="3.1" fill="#fff"/>
  </g>

  <text class="label" x="53" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">GIT</text>
</svg>
