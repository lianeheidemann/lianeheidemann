<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Animated waving hand" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="handFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="55%" stop-color="#8feaff"/>
      <stop offset="100%" stop-color="#4fc8fb"/>
    </linearGradient>
    <linearGradient id="waveLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#73d9ff"/>
      <stop offset="100%" stop-color="#7b73ff"/>
    </linearGradient>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Extra internal margin prevents clipping while the hand rotates -->
  <g transform="translate(42 56)">
    <g filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="rotate"
        values="0 0 0;-10 0 0;8 0 0;-7 0 0;5 0 0;0 0 0"
        keyTimes="0;0.18;0.38;0.58;0.78;1"
        dur="2.1s" repeatCount="indefinite"/>

      <path d="M-7 12
               C-10 8 -12 4 -12 0
               C-12 -4 -9 -7 -5 -7
               C-2 -7 1 -4 3 -1
               L5 1
               L5 -14
               C5 -18 8 -19 11 -17
               C13 -15 13 -13 13 -10
               L13 -1
               L16 -18
               C17 -22 20 -23 23 -21
               C25 -19 25 -16 25 -13
               L25 -1
               L28 -18
               C29 -22 32 -23 35 -21
               C37 -19 37 -16 37 -13
               L37 0
               L39 -15
               C40 -19 43 -20 46 -18
               C48 -16 48 -13 48 -10
               L48 2
               C48 10 44 17 36 21
               C31 24 26 25 20 25
               H9
               C1 25 -4 20 -7 12 Z"
            fill="url(#handFill)" stroke="#7cecff" stroke-width="1.6" stroke-linejoin="round"/>

      <path d="M0 7 C3 9 5 11 7 13" fill="none" stroke="#f4feff" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
      <path d="M13 2 C14 7 14 12 13 17" fill="none" stroke="#f4feff" stroke-width="1.7" stroke-linecap="round" opacity="0.65"/>
      <path d="M25 1 C26 6 26 11 25 16" fill="none" stroke="#f4feff" stroke-width="1.5" stroke-linecap="round" opacity="0.48"/>
      <path d="M37 2 C38 6 38 10 37 14" fill="none" stroke="#f4feff" stroke-width="1.4" stroke-linecap="round" opacity="0.38"/>
    </g>

    <g fill="none" stroke="url(#waveLine)" stroke-width="2.4" stroke-linecap="round" filter="url(#softGlow)">
      <path d="M-24 -14 Q-30 -7 -27 0" opacity="0">
        <animate attributeName="opacity" values="0;.85;.15;0" keyTimes="0;.25;.55;1" dur="2.1s" repeatCount="indefinite"/>
      </path>
      <path d="M-31 -20 Q-39 -10 -35 1" opacity="0">
        <animate attributeName="opacity" values="0;.7;0;.4;0" keyTimes="0;.2;.45;.7;1" dur="2.1s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
