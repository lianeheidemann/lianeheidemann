<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Animated waving hand" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="handFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="55%" stop-color="#8feaff"/>
      <stop offset="100%" stop-color="#4fc8fb"/>
    </linearGradient>
    <linearGradient id="waveLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#73d9ff"/>
      <stop offset="100%" stop-color="#7b73ff"/>
    </linearGradient>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(42 57)">
    <g filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="rotate"
        values="0 0 0;-10 0 0;8 0 0;-7 0 0;5 0 0;0 0 0"
        keyTimes="0;0.18;0.38;0.58;0.78;1"
        dur="2.1s" repeatCount="indefinite"/>

      <path d="M-5 13
               C-8 10 -10 6 -10 2
               C-10 -2 -8 -5 -5 -5
               C-2 -5 0 -3 2 0
               L5 4
               L5 -19
               C5 -23 8 -25 11 -23
               C13 -21 13 -18 13 -15
               L13 -2
               L16 -26
               C17 -30 20 -32 23 -29
               C25 -27 25 -24 25 -20
               L25 -2
               L28 -25
               C29 -29 32 -31 35 -28
               C37 -26 37 -23 37 -19
               L37 -1
               L40 -21
               C41 -25 44 -27 47 -24
               C49 -22 49 -19 49 -15
               L49 2
               C49 11 45 19 37 23
               C32 26 26 27 20 27
               H9
               C2 27 -2 22 -5 13 Z"
            fill="url(#handFill)" stroke="#7cecff" stroke-width="1.6" stroke-linejoin="round"/>

      <path d="M1 8 C3 9 5 11 6 13" fill="none" stroke="#f4feff" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
      <path d="M13 0 C14 7 14 13 13 19" fill="none" stroke="#f4feff" stroke-width="1.7" stroke-linecap="round" opacity="0.65"/>
      <path d="M25 -1 C26 6 26 13 25 19" fill="none" stroke="#f4feff" stroke-width="1.5" stroke-linecap="round" opacity="0.48"/>
      <path d="M37 0 C38 6 38 12 37 17" fill="none" stroke="#f4feff" stroke-width="1.4" stroke-linecap="round" opacity="0.38"/>
    </g>

    <g fill="none" stroke="url(#waveLine)" stroke-width="2.4" stroke-linecap="round" filter="url(#softGlow)">
      <path d="M-24 -15 Q-30 -8 -27 0" opacity="0">
        <animate attributeName="opacity" values="0;.85;.15;0" keyTimes="0;.25;.55;1" dur="2.1s" repeatCount="indefinite"/>
      </path>
      <path d="M-31 -21 Q-39 -11 -35 1" opacity="0">
        <animate attributeName="opacity" values="0;.7;0;.4;0" keyTimes="0;.2;.45;.7;1" dur="2.1s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>