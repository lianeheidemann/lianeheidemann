<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title description">
  <title id="title">Liane Heidemann developer portal</title>
  <desc id="description">Animated profile panel that adapts automatically to light and dark themes.</desc>

  <defs>
    <linearGradient id="backgroundLight" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F8FF"/><stop offset="0.5" stop-color="#E8F0FC"/><stop offset="1" stop-color="#DDE9F8"/>
    </linearGradient>
    <linearGradient id="backgroundDark" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#040817"/><stop offset="0.5" stop-color="#091224"/><stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="flowLight" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0891B2"/><stop offset="0.4" stop-color="#0284C7"/><stop offset="0.68" stop-color="#7C3AED"/><stop offset="1" stop-color="#0891B2"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-160 0;160 0;-160 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="flowDark" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="0.4" stop-color="#38BDF8"/><stop offset="0.68" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-160 0;160 0;-160 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="coreLight" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.25"/><stop offset="0.48" stop-color="#2563EB" stop-opacity="0.10"/><stop offset="0.78" stop-color="#7C3AED" stop-opacity="0.07"/><stop offset="1" stop-color="#F8FBFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreDark" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.32"/><stop offset="0.48" stop-color="#3B82F6" stop-opacity="0.12"/><stop offset="0.78" stop-color="#8B5CF6" stop-opacity="0.05"/><stop offset="1" stop-color="#040817" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridLight" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#0891B2" stroke-opacity="0.075"><animateTransform attributeName="transform" type="translate" values="0 0;36 36;0 0" dur="24s" repeatCount="indefinite"/></path></pattern>
    <pattern id="gridDark" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#67E8F9" stroke-opacity="0.055"><animateTransform attributeName="transform" type="translate" values="0 0;36 36;0 0" dur="24s" repeatCount="indefinite"/></path></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      :root { color-scheme: light dark; }
      .dark { display: none; }
      .name { font: 800 36px 'Segoe UI',Arial,sans-serif; letter-spacing: 5px; }
      .role { font: 500 14px 'Segoe UI',Arial,sans-serif; letter-spacing: 2px; }
      .focus { font: 600 13px 'Segoe UI',Arial,sans-serif; letter-spacing: 2px; }
      .chip { font: 700 12px 'Segoe UI',Arial,sans-serif; letter-spacing: 1.4px; }
      @media (prefers-color-scheme: dark) { .light { display: none; } .dark { display: inline; } }
    </style>
  </defs>

  <rect class="light" width="1200" height="330" rx="30" fill="url(#backgroundLight)"/>
  <rect class="dark" width="1200" height="330" rx="30" fill="url(#backgroundDark)"/>
  <rect class="light" width="1200" height="330" rx="30" fill="url(#gridLight)"/>
  <rect class="dark" width="1200" height="330" rx="30" fill="url(#gridDark)"/>

  <ellipse class="light" cx="600" cy="150" rx="278" ry="178" fill="url(#coreLight)"><animate attributeName="rx" values="270;306;270" dur="10s" repeatCount="indefinite"/><animate attributeName="ry" values="170;194;170" dur="10s" repeatCount="indefinite"/></ellipse>
  <ellipse class="dark" cx="600" cy="150" rx="278" ry="178" fill="url(#coreDark)"><animate attributeName="rx" values="270;306;270" dur="10s" repeatCount="indefinite"/><animate attributeName="ry" values="170;194;170" dur="10s" repeatCount="indefinite"/></ellipse>

  <rect class="light" x="8" y="8" width="1184" height="314" rx="26" fill="none" stroke="url(#flowLight)" stroke-width="2" stroke-opacity="0.76" stroke-dasharray="500 110" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-610" dur="20s" repeatCount="indefinite"/></rect>
  <rect class="dark" x="8" y="8" width="1184" height="314" rx="26" fill="none" stroke="url(#flowDark)" stroke-width="2" stroke-opacity="0.76" stroke-dasharray="500 110" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-610" dur="20s" repeatCount="indefinite"/></rect>

  <g class="light" fill="none" stroke="url(#flowLight)" stroke-linecap="round" filter="url(#glow)"><path d="M108 72H392M808 72H1092" stroke-width="3"/><path d="M118 242H420M780 242H1082" stroke-width="2" opacity="0.68"/></g>
  <g class="dark" fill="none" stroke="url(#flowDark)" stroke-linecap="round" filter="url(#glow)"><path d="M108 72H392M808 72H1092" stroke-width="3"/><path d="M118 242H420M780 242H1082" stroke-width="2" opacity="0.68"/></g>

  <g class="light" fill="none" stroke="#0891B2" stroke-linecap="round" filter="url(#glow)"><g><circle cx="600" cy="80" r="27" fill="#F8FAFC" stroke-width="2.5"/><path d="M600 42V54M600 106V118M562 80H574M626 80H638" stroke-width="2.5"/><path d="M600 53A27 27 0 0 1 626 80" stroke="#7C3AED" stroke-width="4"/><circle cx="627" cy="80" r="3.5" fill="#E0F2FE" stroke-width="1.5"/><animateTransform attributeName="transform" type="rotate" from="0 600 80" to="360 600 80" dur="20s" repeatCount="indefinite"/></g></g>
  <g class="dark" fill="none" stroke="#22D3EE" stroke-linecap="round" filter="url(#glow)"><g><circle cx="600" cy="80" r="27" fill="#071426" stroke-width="2.5"/><path d="M600 42V54M600 106V118M562 80H574M626 80H638" stroke-width="2.5"/><path d="M600 53A27 27 0 0 1 626 80" stroke="#A78BFA" stroke-width="4"/><circle cx="627" cy="80" r="3.5" fill="#E0F2FE" stroke-width="1.5"/><animateTransform attributeName="transform" type="rotate" from="0 600 80" to="360 600 80" dur="20s" repeatCount="indefinite"/></g></g>

  <g class="light"><circle cx="600" cy="80" r="14" fill="#0891B2" fill-opacity="0.14" stroke="#2563EB" stroke-width="1.4"/><path d="M591 80L598 87L610 73" fill="none" stroke="#155E75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values="0.58;1;0.58" dur="4s" repeatCount="indefinite"/></path></g>
  <g class="dark"><circle cx="600" cy="80" r="14" fill="#22D3EE" fill-opacity="0.12" stroke="#60A5FA"/><path d="M591 80L598 87L610 73" fill="none" stroke="#CFFAFE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="opacity" values="0.58;1;0.58" dur="4s" repeatCount="indefinite"/></path></g>

  <g class="light" font-family="'Segoe UI',Arial,sans-serif" text-anchor="middle"><text x="600" y="149" class="name" fill="#0F172A">LIANE HEIDEMANN</text><text x="600" y="179" class="role" fill="#334155">COMPUTER SCIENCE STUDENT</text><text x="600" y="208" class="focus" fill="#0E7490">SOFTWARE DEVELOPMENT  ·  AI  ·  DATA<animate attributeName="fill" values="#0E7490;#1D4ED8;#6D28D9;#0E7490" dur="12s" repeatCount="indefinite"/></text></g>
  <g class="dark" font-family="'Segoe UI',Arial,sans-serif" text-anchor="middle"><text x="600" y="149" class="name" fill="#F8FAFC">LIANE HEIDEMANN</text><text x="600" y="179" class="role" fill="#9FB0C7">COMPUTER SCIENCE STUDENT</text><text x="600" y="208" class="focus" fill="#67E8F9">SOFTWARE DEVELOPMENT  ·  AI  ·  DATA<animate attributeName="fill" values="#67E8F9;#93C5FD;#C4B5FD;#67E8F9" dur="12s" repeatCount="indefinite"/></text></g>

  <g class="light chip" font-family="'Segoe UI',Arial,sans-serif" text-anchor="middle"><g transform="translate(310 264)"><rect width="134" height="34" rx="17" fill="#F8FAFC" stroke="#0891B2" stroke-width="1.5"/><text x="67" y="22" fill="#0F172A">PROJECTS</text></g><g transform="translate(462 264)"><rect width="128" height="34" rx="17" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5"/><text x="64" y="22" fill="#0F172A">TECH STACK</text></g><g transform="translate(608 264)"><rect width="128" height="34" rx="17" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5"/><text x="64" y="22" fill="#0F172A">ABOUT ME</text></g><g transform="translate(754 264)"><rect width="136" height="34" rx="17" fill="#F8FAFC" stroke="#0891B2" stroke-width="1.5"/><text x="68" y="22" fill="#0F172A">CONTACT</text></g></g>
  <g class="dark chip" font-family="'Segoe UI',Arial,sans-serif" text-anchor="middle"><g transform="translate(310 264)"><rect width="134" height="34" rx="17" fill="#0B172A" stroke="#22D3EE" stroke-opacity="0.55"/><text x="67" y="22" fill="#DBEAFE">PROJECTS</text></g><g transform="translate(462 264)"><rect width="128" height="34" rx="17" fill="#0B172A" stroke="#60A5FA" stroke-opacity="0.55"/><text x="64" y="22" fill="#DBEAFE">TECH STACK</text></g><g transform="translate(608 264)"><rect width="128" height="34" rx="17" fill="#0B172A" stroke="#8B5CF6" stroke-opacity="0.58"/><text x="64" y="22" fill="#DBEAFE">ABOUT ME</text></g><g transform="translate(754 264)"><rect width="136" height="34" rx="17" fill="#0B172A" stroke="#22D3EE" stroke-opacity="0.55"/><text x="68" y="22" fill="#DBEAFE">CONTACT</text></g></g>
</svg>
