<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Explore all my projects</title>
  <desc id="desc">A dark-theme project-list link banner with left and right navigation arrows.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="150" gradientUnits="userSpaceOnUse"><stop stop-color="#040817"/><stop offset=".5" stop-color="#091224"/><stop offset="1" stop-color="#0B1020"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#22D3EE"/><stop offset=".4" stop-color="#38BDF8"/><stop offset=".7" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%"><stop stop-color="#22D3EE" stop-opacity=".17"/><stop offset="1" stop-color="#040817" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#67E8F9" stroke-opacity=".055"/></pattern>
  </defs>
  <rect x="8" y="8" width="1184" height="134" rx="66" fill="url(#panel)" stroke="url(#edge)" stroke-width="3"/>
  <rect x="10" y="10" width="1180" height="130" rx="64" fill="url(#grid)"/>
  <ellipse cx="600" cy="75" rx="410" ry="74" fill="url(#glow)"/>
  <text x="600" y="86" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" letter-spacing="-.35">Explore all my projects</text>
</svg>
