<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Liane Heidemann — Developer Profile</title>
  <desc id="desc">Futuristic dark GitHub profile banner for a Computer Science student focused on software development, artificial intelligence and data.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="0.52" stop-color="#0a1022"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#60a5fa"/>
      <stop offset="0.72" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#3b82f6" stop-opacity="0.13"/>
      <stop offset="0.75" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#050914" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#78a9d8" stroke-opacity="0.065" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="28" fill="url(#background)"/>
  <rect width="1200" height="330" rx="28" fill="url(#grid)"/>
  <ellipse cx="600" cy="154" rx="290" ry="190" fill="url(#core)"/>
  <circle cx="600" cy="105" r="58" fill="#22d3ee" opacity="0.06" filter="url(#softGlow)"/>

  <path d="M28 110V40Q28 18 50 18H238 M962 18H1150Q1172 18 1172 40V110 M28 220V290Q28 312 50 312H238 M962 312H1150Q1172 312 1172 290V220"
        fill="none" stroke="url(#neon)" stroke-width="2"/>
  <path d="M0 18H468 M732 18H1200 M0 312H352 M848 312H1200" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.85"/>

  <path d="M114 78H384 M816 78H1086" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <circle cx="600" cy="82" r="27" fill="#081426" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="600" cy="82" r="15" fill="#22d3ee" fill-opacity="0.13" stroke="#60a5fa" stroke-width="1"/>
  <path d="M600 42V55M600 109V122M560 82H573M627 82H640" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M590 82L597 89L611 74" fill="none" stroke="#a5f3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="600" y="39" fill="#8be9f5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="3" text-anchor="middle">LIANE // DEV PORTAL</text>
  <text x="600" y="150" fill="#f4f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" letter-spacing="4" text-anchor="middle">LIANE HEIDEMANN</text>
  <text x="600" y="180" fill="#9fb0c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="2" text-anchor="middle">COMPUTER SCIENCE STUDENT</text>
  <text x="600" y="210" fill="#66d9ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="1.7" text-anchor="middle">SOFTWARE DEVELOPMENT  ·  AI  ·  DATA</text>

  <path d="M118 239H398 M802 239H1082" stroke="url(#neon)" stroke-width="1.5" opacity="0.75"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">
    <g transform="translate(312 262)">
      <rect width="132" height="36" rx="18" fill="#091426" fill-opacity="0.78" stroke="#22d3ee" stroke-opacity="0.65"/>
      <text x="66" y="23" fill="#dcecff">PROJECTS</text>
    </g>
    <g transform="translate(462 262)">
      <rect width="126" height="36" rx="18" fill="#0b1225" fill-opacity="0.78" stroke="#60a5fa" stroke-opacity="0.65"/>
      <text x="63" y="23" fill="#dcecff">TECH STACK</text>
    </g>
    <g transform="translate(606 262)">
      <rect width="126" height="36" rx="18" fill="#0c1125" fill-opacity="0.78" stroke="#8b5cf6" stroke-opacity="0.68"/>
      <text x="63" y="23" fill="#dcecff">ABOUT ME</text>
    </g>
    <g transform="translate(750 262)">
      <rect width="138" height="36" rx="18" fill="#091426" fill-opacity="0.78" stroke="#22d3ee" stroke-opacity="0.65"/>
      <text x="69" y="23" fill="#dcecff">CONTACT</text>
    </g>
  </g>

  <g fill="#22d3ee">
    <circle cx="76" cy="164" r="2"/><circle cx="91" cy="164" r="2" opacity="0.55"/><circle cx="106" cy="164" r="2" opacity="0.25"/>
    <circle cx="1124" cy="164" r="2"/><circle cx="1109" cy="164" r="2" opacity="0.55"/><circle cx="1094" cy="164" r="2" opacity="0.25"/>
  </g>
</svg>
