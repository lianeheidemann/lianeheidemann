<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Liane Heidemann — Developer Profile</title>
  <desc id="desc">Futuristic dark GitHub profile banner for a Computer Science student focused on software development, artificial intelligence and data.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="0.52" stop-color="#0a1022"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#60a5fa"/>
      <stop offset="0.72" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.16 0;0.16 0;-0.16 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#3b82f6" stop-opacity="0.13"/>
      <stop offset="0.75" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#050914" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#78a9d8" stroke-opacity="0.065" stroke-width="1">
        <animateTransform attributeName="transform" type="translate" values="0 0;36 36;0 0" dur="22s" repeatCount="indefinite"/>
      </path>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="scanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="330" rx="28" fill="url(#background)"/>
  <rect width="1200" height="330" rx="28" fill="url(#grid)"/>
  <ellipse cx="600" cy="154" rx="290" ry="190" fill="url(#core)">
    <animate attributeName="rx" values="270;315;270" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="175;205;175" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <circle class="core-halo" cx="600" cy="105" r="58" fill="#22d3ee" opacity="0.06" filter="url(#softGlow)">
    <animate attributeName="r" values="48;70;48" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.04;0.14;0.04" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <rect class="scan-line" x="28" y="-10" width="1144" height="2" rx="1" fill="url(#scanner)" opacity="0">
    <animate attributeName="y" values="-10;330" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.38;0.38;0" keyTimes="0;0.15;0.85;1" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <path class="border-path" d="M28 110V40Q28 18 50 18H238 M962 18H1150Q1172 18 1172 40V110 M28 220V290Q28 312 50 312H238 M962 312H1150Q1172 312 1172 290V220"
        fill="none" stroke="url(#neon)" stroke-width="2" stroke-dasharray="420 85">
    <animate attributeName="stroke-dashoffset" from="0" to="-505" dur="7s" repeatCount="indefinite"/>
  </path>
  <path class="edge-line" d="M0 18H468 M732 18H1200 M0 312H352 M848 312H1200" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.85" stroke-dasharray="260 42">
    <animate attributeName="stroke-dashoffset" from="0" to="-302" dur="5.5s" repeatCount="indefinite"/>
  </path>

  <path d="M114 78H384 M816 78H1086" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <g class="core-ring">
    <animateTransform attributeName="transform" type="rotate" from="0 600 82" to="360 600 82" dur="9s" repeatCount="indefinite"/>
    <circle cx="600" cy="82" r="27" fill="#081426" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M600 42V55M600 109V122M560 82H573M627 82H640" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <circle cx="600" cy="82" r="15" fill="#22d3ee" fill-opacity="0.13" stroke="#60a5fa" stroke-width="1"/>
  <path class="core-check" d="M590 82L597 89L611 74" fill="none" stroke="#a5f3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <text x="600" y="39" fill="#8be9f5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="3" text-anchor="middle">LIANE // DEV PORTAL</text>
  <text class="hero-title" x="600" y="150" fill="#f4f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="35" font-weight="700" letter-spacing="4" text-anchor="middle">LIANE HEIDEMANN<animate attributeName="opacity" values="0.86;1;0.86" dur="4s" repeatCount="indefinite"/></text>
  <text x="600" y="180" fill="#9fb0c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="2" text-anchor="middle">COMPUTER SCIENCE STUDENT</text>
  <text class="focus-line" x="600" y="210" fill="#66d9ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="1.7" text-anchor="middle">SOFTWARE DEVELOPMENT  ·  AI  ·  DATA<animate attributeName="fill" values="#66d9ef;#a5f3fc;#8b5cf6;#66d9ef" dur="5s" repeatCount="indefinite"/></text>

  <path d="M118 239H398 M802 239H1082" stroke="url(#neon)" stroke-width="1.5" opacity="0.75"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" text-anchor="middle">
    <g class="nav-button nav-1" transform="translate(312 262)">
      <rect width="132" height="36" rx="18" fill="#091426" fill-opacity="0.78" stroke="#22d3ee" stroke-opacity="0.65"/>
      <text x="66" y="23" fill="#dcecff">PROJECTS</text>
    </g>
    <g class="nav-button nav-2" transform="translate(462 262)">
      <rect width="126" height="36" rx="18" fill="#0b1225" fill-opacity="0.78" stroke="#60a5fa" stroke-opacity="0.65"/>
      <text x="63" y="23" fill="#dcecff">TECH STACK</text>
    </g>
    <g class="nav-button nav-3" transform="translate(606 262)">
      <rect width="126" height="36" rx="18" fill="#0c1125" fill-opacity="0.78" stroke="#8b5cf6" stroke-opacity="0.68"/>
      <text x="63" y="23" fill="#dcecff">ABOUT ME</text>
    </g>
    <g class="nav-button nav-4" transform="translate(750 262)">
      <rect width="138" height="36" rx="18" fill="#091426" fill-opacity="0.78" stroke="#22d3ee" stroke-opacity="0.65"/>
      <text x="69" y="23" fill="#dcecff">CONTACT</text>
    </g>
  </g>

  <g fill="#22d3ee">
    <circle class="signal-1" cx="76" cy="164" r="2"/><circle class="signal-2" cx="91" cy="164" r="2" opacity="0.55"/><circle class="signal-3" cx="106" cy="164" r="2" opacity="0.25"/>
    <circle class="signal-1" cx="1124" cy="164" r="2"/><circle class="signal-2" cx="1109" cy="164" r="2" opacity="0.55"/><circle class="signal-3" cx="1094" cy="164" r="2" opacity="0.25"/>
  </g>
</svg>
