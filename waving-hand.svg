<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Animated waving hand</title>
  <desc id="description">A stylized light-skin waving hand with four long fingers and a proportionate thumb.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8D5BB"/>
      <stop offset="1" stop-color="#EAB48D"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6B3F2A" flood-opacity="0.24"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-7 64 111;9 64 111;-5 64 111;7 64 111;-7 64 111" keyTimes="0;0.22;0.46;0.7;1" dur="2.8s" repeatCount="indefinite"/>

      <rect x="33" y="37" width="15" height="55" rx="7.5" transform="rotate(-9 40.5 86)" fill="url(#skin)" stroke="#D89A72" stroke-width="2"/>
      <rect x="47" y="20" width="16" height="69" rx="8" transform="rotate(-3 55 82)" fill="url(#skin)" stroke="#D89A72" stroke-width="2"/>
      <rect x="63" y="12" width="17" height="77" rx="8.5" transform="rotate(2 71.5 82)" fill="url(#skin)" stroke="#D89A72" stroke-width="2"/>
      <rect x="80" y="22" width="16" height="68" rx="8" transform="rotate(7 88 84)" fill="url(#skin)" stroke="#D89A72" stroke-width="2"/>

      <path d="M38 70C45 58 55 55 68 57C84 59 95 68 98 84L101 103C103 114 94 123 83 123H57C45 123 36 115 35 103L33 84C32 79 34 74 38 70Z" fill="url(#skin)" stroke="#D89A72" stroke-width="2" stroke-linejoin="round"/>

      <path d="M40 73C33 67 26 60 21 62C16 64 17 71 21 77L37 99C41 104 49 104 53 99C57 94 55 87 50 83Z" fill="url(#skin)" stroke="#D89A72" stroke-width="2" stroke-linejoin="round"/>

      <path d="M50 94C58 89 69 88 79 91" fill="none" stroke="#C98761" stroke-width="2.3" stroke-linecap="round" opacity="0.72"/>
      <path d="M47 104C56 101 66 102 74 106" fill="none" stroke="#C98761" stroke-width="2" stroke-linecap="round" opacity="0.58"/>
      <path d="M31 74C35 75 39 78 42 82" fill="none" stroke="#C98761" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
</svg>
