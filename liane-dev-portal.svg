<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title description">
  <title id="title">Liane Heidemann developer portal</title>
  <desc id="description">Animated developer profile panel that automatically adapts to the viewer's light or dark color scheme.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop class="bg-start" offset="0" stop-color="#040817"/>
      <stop class="bg-mid" offset="0.5" stop-color="#091224"/>
      <stop class="bg-end" offset="1" stop-color="#0b1020"/>
    </linearGradient>

    <linearGradient id="flow" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop class="flow-1" offset="0" stop-color="#22d3ee"/>
      <stop class="flow-2" offset="0.4" stop-color="#38bdf8"/>
      <stop class="flow-3" offset="0.68" stop-color="#8b5cf6"/>
      <stop class="flow-4" offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-160 0;160 0;-160 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="core" cx="50%" cy="48%" r="52%">
      <stop class="core-1" offset="0" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop class="core-2" offset="0.48" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop class="core-3" offset="0.78" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop class="core-4" offset="1" stop-color="#040817" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path class="grid-line" d="M36 0H0V36" fill="none" stroke="#67e8f9" stroke-opacity="0.055">
        <animateTransform attributeName="transform" type="translate" values="0 0;36 36;0 0" dur="24s" repeatCount="indefinite"/>
      </path>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .micro { font: 700 11px 'Segoe UI', Arial, sans-serif; letter-spacing: 4px; }
      .name { font: 800 36px 'Segoe UI', Arial, sans-serif; letter-spacing: 5px; }
      .role { font: 500 14px 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; }
      .focus { font: 600 13px 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; }
      .chip { font: 700 12px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.4px; }

      /* Dark mode is the default palette. */
      .micro-text { fill: #8be9f5; }
      .name-text { fill: #f8fafc; }
      .role-text { fill: #9fb0c7; }
      .focus-text { fill: #67e8f9; }
      .ring-shell { fill: #071426; }
      .ring-dot { fill: #e0f2fe; }
      .core-disc { fill: #22d3ee; fill-opacity: .12; stroke: #60a5fa; }
      .check { stroke: #cffafe; }
      .chip-bg { fill: #0b172a; }
      .chip-text { fill: #dbeafe; }

      /* GitHub/browser light theme. The SVG follows the device/browser color scheme. */
      @media (prefers-color-scheme: light) {
        .bg-start { stop-color: #f8fbff; }
        .bg-mid { stop-color: #eef6ff; }
        .bg-end { stop-color: #f7f4ff; }

        .flow-1, .flow-4 { stop-color: #0891b2; }
        .flow-2 { stop-color: #2563eb; }
        .flow-3 { stop-color: #7c3aed; }

        .core-1 { stop-color: #38bdf8; stop-opacity: .20; }
        .core-2 { stop-color: #60a5fa; stop-opacity: .12; }
        .core-3 { stop-color: #a78bfa; stop-opacity: .08; }
        .core-4 { stop-color: #ffffff; stop-opacity: 0; }

        .grid-line { stroke: #0ea5e9; stroke-opacity: .09; }
        .micro-text { fill: #0369a1; }
        .name-text { fill: #0f172a; }
        .role-text { fill: #475569; }
        .focus-text { fill: #0369a1 !important; }
        .ring-shell { fill: #eef8ff; }
        .ring-dot { fill: #0f172a; }
        .core-disc { fill: #38bdf8; fill-opacity: .12; stroke: #2563eb; }
        .check { stroke: #075985; }
        .chip-bg { fill: #ffffff; fill-opacity: .84; }
        .chip-text { fill: #1e3a5f; }
      }
    </style>
  </defs>

  <rect width="1200" height="330" rx="30" fill="url(#background)"/>
  <rect width="1200" height="330" rx="30" fill="url(#grid)"/>

  <ellipse cx="600" cy="150" rx="278" ry="178" fill="url(#core)">
    <animate attributeName="rx" values="270;306;270" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="170;194;170" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <rect x="8" y="8" width="1184" height="314" rx="26" fill="none" stroke="url(#flow)" stroke-width="2" stroke-opacity="0.76" stroke-dasharray="500 110" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-610" dur="20s" repeatCount="indefinite"/>
  </rect>

  <g fill="none" stroke="url(#flow)" stroke-linecap="round" filter="url(#glow)">
    <path d="M108 72H392M808 72H1092" stroke-width="3"/>
    <path d="M118 242H420M780 242H1082" stroke-width="2" opacity="0.68"/>
  </g>

  <g fill="none" stroke="#22d3ee" stroke-linecap="round" filter="url(#glow)">
    <g>
      <circle class="ring-shell" cx="600" cy="80" r="27" stroke-width="2.5"/>
      <path d="M600 42V54M600 106V118M562 80H574M626 80H638" stroke-width="2.5"/>
      <path d="M600 53A27 27 0 0 1 626 80" stroke="#a78bfa" stroke-width="4"/>
      <circle class="ring-dot" cx="627" cy="80" r="3.5" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate" from="0 600 80" to="360 600 80" dur="20s" repeatCount="indefinite"/>
    </g>
  </g>

  <circle class="core-disc" cx="600" cy="80" r="14" stroke-width="1"/>
  <path class="check" d="M591 80L598 87L610 73" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="0.58;1;0.58" dur="4s" repeatCount="indefinite"/>
  </path>

  <g font-family="'Segoe UI',Arial,sans-serif" text-anchor="middle">
    <text x="600" y="34" class="micro micro-text">LIANE // SYSTEM INTERFACE</text>
    <text x="600" y="149" class="name name-text">LIANE HEIDEMANN</text>
    <text x="600" y="179" class="role role-text">COMPUTER SCIENCE STUDENT</text>
    <text x="600" y="208" class="focus focus-text">SOFTWARE DEVELOPMENT  ·  AI  ·  DATA
      <animate attributeName="fill" values="#67e8f9;#93c5fd;#c4b5fd;#67e8f9" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" text-anchor="middle" class="chip">
    <g transform="translate(310 264)">
      <rect class="chip-bg" width="134" height="34" rx="17" stroke="#22d3ee" stroke-opacity="0.55"/>
      <text class="chip-text" x="67" y="22">PROJECTS</text>
    </g>
    <g transform="translate(462 264)">
      <rect class="chip-bg" width="128" height="34" rx="17" stroke="#60a5fa" stroke-opacity="0.55"/>
      <text class="chip-text" x="64" y="22">TECH STACK</text>
    </g>
    <g transform="translate(608 264)">
      <rect class="chip-bg" width="128" height="34" rx="17" stroke="#8b5cf6" stroke-opacity="0.58"/>
      <text class="chip-text" x="64" y="22">ABOUT ME</text>
    </g>
    <g transform="translate(754 264)">
      <rect class="chip-bg" width="136" height="34" rx="17" stroke="#22d3ee" stroke-opacity="0.55"/>
      <text class="chip-text" x="68" y="22">CONTACT</text>
    </g>
  </g>
</svg>
